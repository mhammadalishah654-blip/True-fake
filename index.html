<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise For You</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; color: #fff; font-family: sans-serif; }
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .active { display: flex; }

        /* SCREEN 1: BAIT SCREEN */
        #bait-screen { background-color: #000; }
        .bait-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; max-width: 80%; line-height: 1.5; }
        .bait-emoji { font-size: 35px; margin-bottom: 30px; }
        .pink-btn { background: linear-gradient(90deg, #ff0055, #ff0077); color: white; border: none; padding: 18px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px #ff0055; }

        /* SCREEN 2: AESTHETIC SURPRISE SCREEN */
        #aesthetic-screen { background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)); }
        .aesthetic-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 35px 25px; border-radius: 24px; max-width: 90%; width: 380px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); z-index: 10; }
        .aesthetic-title { font-family: 'Georgia', serif; font-size: 22px; font-style: italic; line-height: 1.6; color: #fff; margin-bottom: 30px; }
        .see-more-btn { background: linear-gradient(135deg, #ffffff, #e0e0e0); color: #000; border: none; padding: 15px 35px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); }

        /* ROSE PETAL RAIN */
        .petal { position: absolute; background-color: #ffb7c5; border-radius: 150% 0 150% 40%; opacity: 0.85; z-index: 1; pointer-events: none; animation: float linear infinite; }
        @keyframes float {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(120px) rotate(360deg); }
        }

        /* SCREEN 3: THE TRAP SCREEN */
        #trap-screen { background-color: #000; font-family: 'Courier New', Courier, monospace; }
        
        .laugh-emoji { font-size: 70px; display: none; animation: shake 0.3s infinite alternate; margin-bottom: 20px; z-index: 20; }
        @keyframes shake {
            0% { transform: scale(1) rotate(-10deg); }
            100% { transform: scale(1.2) rotate(10deg); }
        }

        .typing-text { font-size: 20px; font-weight: bold; width: 85%; max-width: 600px; color: #ff3333; line-height: 1.5; min-height: 60px; z-index: 15; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        
        /* Hacker Background Image */
        .hacker-bg {
            display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background-image: url('https://imgbox.com');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.3; z-index: 2;
        }

        /* Police Flashing Lights Effect */
        .police-flash { animation: policeBlink 0.4s infinite linear; }
        @keyframes policeBlink {
            0%, 49% { background-color: rgba(255, 0, 0, 0.3); }
            50%, 100% { background-color: rgba(0, 0, 255, 0.3); }
        }

        /* Hacking Logs Stream Container */
        #hacker-logs {
            display: none; flex-direction: column; text-align: left; align-items: flex-start;
            width: 90%; max-width: 500px; margin-top: 20px; z-index: 15; color: #00ff00; font-size: 13px;
            line-height: 1.6; max-height: 40vh; overflow-y: auto; font-weight: bold;
        }
        .log-line { margin-bottom: 4px; text-shadow: 0 0 5px #00ff00; }
        .red-warning { color: #ff0000; font-size: 16px; border: 2px solid #ff0000; padding: 8px; width: 100%; margin-bottom: 15px; text-shadow: 0 0 5px #ff0000; box-shadow: 0 0 5px #ff0000; text-align: center; }
    </style>
</head>
<body>

    <!-- SCREEN 1: BAIT SCREEN -->
    <div id="bait-screen" class="screen active">
        <div class="bait-text">Tap below to see who secretly likes you!</div>
        <div class="bait-emoji">😉</div>
        <button class="pink-btn" onclick="goToAestheticScreen()">Check Now 🔍</button>
    </div>

    <!-- SCREEN 2: AESTHETIC SURPRISE SCREEN -->
    <div id="aesthetic-screen" class="screen">
        <div class="aesthetic-card">
            <div class="aesthetic-title">If you are interested, see his pics and chats 💐</div>
            <button class="see-more-btn" onclick="startTrapScreen()">Click here to see</button>
        </div>
    </div>

    <!-- SCREEN 3: THE ULTIMATE TRAP SCREEN -->
    <div id="trap-screen" class="screen">
        <div class="hacker-bg" id="hacker-pic"></div>
        <div class="laugh-emoji" id="laugh-box">😂🤣</div>
        <div class="typing-text" id="dynamic-txt"></div>
        
        <!-- Live Attack Terminal -->
        <div id="hacker-logs">
            <div class="red-warning">🚨 DEVICE EXPLOITED & LIVE DATA UPLOADING... 🚨</div>
        </div>
    </div>

    <script>
        function goToAestheticScreen() {
            document.getElementById('bait-screen').style.display = 'none';
            document.getElementById('aesthetic-screen').style.display = 'flex';
            createPetals();
        }

        function startTrapScreen() {
            document.getElementById('aesthetic-screen').style.display = 'none';
            document.getElementById('trap-screen').style.display = 'flex';
            
            const laughBox = document.getElementById('laugh-box');
            laughBox.style.display = 'block';

            // 1.5 Second Laughing Emoji Display
            setTimeout(() => {
                laughBox.style.display = 'none';
                
                // Typing sentence 1
                typeSentence("how idiot you are 😂 you really thought that someone do this for you.....", () => {
                    setTimeout(() => {
                        document.getElementById('dynamic-txt').innerText = "";
                        document.getElementById('trap-screen').classList.add('police-flash');
                        document.getElementById('hacker-pic').style.display = 'block';

                        // Start continuous Vibration
                        startVibration();

                        // Typing sentence 2
                        typeSentence("device is hacked live video is sending to host 💀", () => {
                            document.getElementById('hacker-logs').style.display = 'flex';
                            typeLogs();
                        });
                    }, 1200);
                });
            }, 1500);
        }

        function typeSentence(text, callback) {
            const target = document.getElementById('dynamic-txt');
            let idx = 0;
            function typist() {
                if (idx < text.length) {
                    target.innerHTML += text.charAt(idx);
                    idx++;
                    setTimeout(typist, 40);
                } else if(callback) {
                    callback();
                }
            }
            typist();
        }

        const attackLogs = [
            "[*] ACCESSING IP ADDRESS AND PHONE GEOLOCATION...",
            "[*] INJECTING COMPROMISED SYSTEM OS EXPLOIT...",
            "[*] EXPORTING LOCAL WHATSAPP CHATS & CONTACT LIST...",
            "[*] FRONT CAMERA CAPTURED STREAM: STREAMING ACTIVE...",
            "[*] ALL COOKIES AND STORED PASSWORDS DUMPED...",
            "[!] BACKING UP DATA TO ENCRYPTED REMOTE SERVER...",
            "[*] PHONE SYSTEM WIPED SUCCESSFULLY. BYE! 💀"
        ];
        let logIdx = 0;

        function typeLogs() {
            if (logIdx < attackLogs.length) {
                const container = document.getElementById('hacker-logs');
                const line = document.createElement('div');
                line.className = 'log-line';
                line.innerText = attackLogs[logIdx];
                container.appendChild(line);
                logIdx++;
                setTimeout(typeLogs, 800);
            }
        }

        // Safe loop vibration for mobile devices
        function startVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([500, 300, 500, 300, 500]);
                setInterval(() => { 
                    navigator.vibrate([500, 300, 500]); 
                }, 2000);
            }
        }

        function createPetals() {
            const container = document.getElementById('aesthetic-screen');
            const petalCount = 35;
            const colors = ['#ffb7c5', '#ff94a2', '#ff6b81', '#fff0f2'];
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.width = Math.random() * 12 + 10 + 'px';
                petal.style.height = Math.random() * 12 + 10 + 'px';
                petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                petal.style.animationName = 'float';
                petal.style.animationDuration = (Math.random() * 3 + 4) + 's';
                petal.style.animationDelay = '-' + Math.random() * 5 + 's';
                petal.style.animationIterationCount = 'infinite';
                petal.style.animationTimingFunction = 'linear';
                container.appendChild(petal);
            }
        }
    </script>
</body>
</html>
